version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: farming_postgres
    restart: always
    environment:
      POSTGRES_DB: farming_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farming_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/farming_db
      - SECRET_KEY=farming-assistant-super-secret-key-change-in-production-btech-project
      - APP_ENV=production
    depends_on:
      - postgres
    volumes:
      - ./backend/static/uploads:/app/static/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farming_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
